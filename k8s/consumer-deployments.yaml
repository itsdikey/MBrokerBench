apiVersion: apps/v1
kind: Deployment
metadata:
  name: mbroker-consumer-small
  labels:
    app: mbroker-consumer
    profile: small
spec:
  replicas: 0
  selector:
    matchLabels:
      app: mbroker-consumer
      profile: small
  template:
    metadata:
      labels:
        app: mbroker-consumer
        profile: small
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: consumer
          image: mbroker-consumer:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: BOOTSTRAP_SERVERS
              value: "my-cluster-kafka-bootstrap:9093"
            - name: TOPIC
              value: "test-1"
            - name: GROUP_ID
              value: "test-group"
            - name: MAX_RATE_LIMIT
              value: "500"
            - name: CONSUMER_PROFILE
              value: "small"
            - name: LOG_LEVEL
              value: "Information"
            - name: MANUAL_PARTITION_ASSIGNMENT_ENABLED
              value: "false"
            - name: ASSIGNMENT_CONFIG_MAP_PATH
              value: "/etc/mbroker-assignments/assignments.json"
            - name: ASSIGNMENT_POLL_INTERVAL_SECONDS
              value: "15"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /tmp/consumer-ready
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /tmp/consumer-healthy
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: mbroker-assignments
              mountPath: /etc/mbroker-assignments
              readOnly: true
      volumes:
        - name: mbroker-assignments
          configMap:
            name: mbroker-partition-assignments
            optional: true
---
