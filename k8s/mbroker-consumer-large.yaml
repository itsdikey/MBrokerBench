---
# Large consumer profile: 2500 msgs/s capacity, 2.0 CPU, 2GB RAM
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mbroker-consumer-large
  labels:
    app: mbroker-consumer
    profile: large
spec:
  replicas: 0
  selector:
    matchLabels:
      app: mbroker-consumer
      profile: large
  template:
    metadata:
      labels:
        app: mbroker-consumer
        profile: large
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: consumer
          # TODO: Replace with the actual consumer agent image once built
          image: "<REGISTRY>/mbroker-consumer:latest"
          imagePullPolicy: IfNotPresent
          env:
            - name: BOOTSTRAP_SERVERS
              value: "my-cluster-kafka-bootstrap:9093"
            - name: TOPIC
              value: "my-topic"
            - name: GROUP_ID
              value: "mbrokerbench-group"
            - name: MAX_RATE_LIMIT
              value: "2500"
            - name: CONSUMER_PROFILE
              value: "large"
            - name: LOG_LEVEL
              value: "Information"
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /tmp/consumer-ready
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /tmp/consumer-healthy
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
