---
# Small consumer profile: 500 msgs/s capacity, 0.5 CPU, 512MB RAM
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mbroker-consumer-small
  labels:
    app: mbroker-consumer
    profile: small
spec:
  replicas: 0
  selector:
    matchLabels:
      app: mbroker-consumer
      profile: small
  template:
    metadata:
      labels:
        app: mbroker-consumer
        profile: small
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: consumer
          # TODO: Replace with the actual consumer agent image once built
          image: "<REGISTRY>/mbroker-consumer:latest"
          imagePullPolicy: IfNotPresent
          env:
            - name: BOOTSTRAP_SERVERS
              value: "my-cluster-kafka-bootstrap:9093"
            - name: TOPIC
              value: "my-topic"
            - name: GROUP_ID
              value: "mbrokerbench-group"
            - name: MAX_RATE_LIMIT
              value: "500"
            - name: CONSUMER_PROFILE
              value: "small"
            - name: LOG_LEVEL
              value: "Information"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /tmp/consumer-ready
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /tmp/consumer-healthy
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
